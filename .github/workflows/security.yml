name: "Security and Code Quality"

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dockerfile-lint:
    name: "Lint Dockerfile"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Run Hadolint"
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3028,DL3029,DL3009

  shell-check:
    name: "Check Shell Scripts"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Validate shell syntax"
        run: |
          echo "🔍 Checking shell script syntax..."
          find install -name "*.sh" -type f | while read file; do
            echo "  Validating: $file"
            sh -n "$file" || exit 1
          done
          echo "✓ All shell scripts are valid"

      - name: "Run ShellCheck"
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: install
          severity: warning

  security-scan:
    name: "Security Scanning"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Run Trivy vulnerability scanner"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: "Upload Trivy results to GitHub Security tab"
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  changelog-check:
    name: "Verify CHANGELOG Updated"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Check CHANGELOG.md modified"
        run: |
          if git diff --name-only HEAD~1 | grep -q "CHANGELOG.md"; then
            echo "✓ CHANGELOG.md has been updated"
          else
            echo "⚠️  Warning: CHANGELOG.md was not modified in this PR"
            echo "Please ensure you've documented your changes in CHANGELOG.md"
            exit 0
          fi

  documentation:
    name: "Validate Documentation"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Check README.md exists and has content"
        run: |
          if [ ! -f README.md ]; then
            echo "❌ README.md not found"
            exit 1
          fi
          
          if [ ! -s README.md ]; then
            echo "❌ README.md is empty"
            exit 1
          fi
          
          echo "✓ README.md is valid"

      - name: "Validate Markdown"
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: CHANGELOG.md README.md
          ignore_files: node_modules

  results:
    name: "Security Scan Summary"
    runs-on: ubuntu-latest
    needs: [dockerfile-lint, shell-check, security-scan, documentation]
    if: always()

    steps:
      - name: "Check job results"
        run: |
          RESULTS="dockerfile-lint=${{ needs.dockerfile-lint.result }}, shell-check=${{ needs.shell-check.result }}, security-scan=${{ needs.security-scan.result }}, documentation=${{ needs.documentation.result }}"
          echo "📊 Security Scan Results: ${RESULTS}"
          
          if [ "${{ needs.dockerfile-lint.result }}" != "success" ] || \
             [ "${{ needs.shell-check.result }}" != "success" ] || \
             [ "${{ needs.security-scan.result }}" != "success" ] || \
             [ "${{ needs.documentation.result }}" != "success" ]; then
            echo "⚠️  Some security checks failed or were skipped"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              exit 0
            fi
          else
            echo "✅ All security checks passed!"
          fi
