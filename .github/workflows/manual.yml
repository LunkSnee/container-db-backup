name: "Manual Build and Publish"

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image to registry even on non-default branches"
        required: false
        type: boolean
        default: false
      skip_tests:
        description: "Skip test steps (not recommended)"
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  manual-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            tag_suffix: amd64
          - platform: linux/arm64
            tag_suffix: arm64
          - platform: linux/arm/v7
            tag_suffix: armv7

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@v3

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Log in to GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Extract version from CHANGELOG"
        id: version
        run: |
          VERSION=$(grep -m 1 "^## " CHANGELOG.md | sed 's/^## \([^ ]*\).*/\1/')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "🏷️  Version: ${VERSION}"

      - name: "Determine branch tag"
        id: branch_tag
        run: |
          BRANCH=$(echo "${GITHUB_REF#refs/heads/}")
          if [ "$BRANCH" = "main" ]; then
            TAG="latest"
          else
            TAG="$BRANCH"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "📍 Branch: $BRANCH -> Tag: $TAG"

      - name: "Validate shell scripts"
        if: success() && !inputs.skip_tests
        run: |
          echo "🔍 Validating shell scripts..."
          find install -name "*.sh" -type f -exec sh -n {} \; && echo "✓ All shell scripts valid" || echo "✗ Script validation failed"

      - name: "Build and push Docker image"
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}-${{ matrix.tag_suffix }}
            ghcr.io/${{ github.repository }}:${{ steps.branch_tag.outputs.tag }}-${{ matrix.tag_suffix }}
          labels: |
            org.opencontainers.image.title=container-db-backup
            org.opencontainers.image.description=Production-grade database backup container with security hardening
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            org.opencontainers.image.revision=${{ github.sha }}

  create-manifest:
    needs: manual-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Log in to GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Extract version and branch info"
        id: info
        run: |
          VERSION=$(grep -m 1 "^## " CHANGELOG.md | sed 's/^## \([^ ]*\).*/\1/')
          BRANCH=$(echo "${GITHUB_REF#refs/heads/}")
          if [ "$BRANCH" = "main" ]; then
            TAG="latest"
          else
            TAG="$BRANCH"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: "Create and push multi-arch manifests"
        run: |
          echo "📦 Creating multi-architecture manifests..."
          
          # Version manifest
          docker manifest create ghcr.io/${{ github.repository }}:${{ steps.info.outputs.version }} \
            ghcr.io/${{ github.repository }}:${{ steps.info.outputs.version }}-amd64 \
            ghcr.io/${{ github.repository }}:${{ steps.info.outputs.version }}-arm64 \
            ghcr.io/${{ github.repository }}:${{ steps.info.outputs.version }}-armv7
          docker manifest push ghcr.io/${{ github.repository }}:${{ steps.info.outputs.version }}
          echo "✓ Pushed: ghcr.io/${{ github.repository }}:${{ steps.info.outputs.version }}"
          
          # Branch/latest manifest
          docker manifest create ghcr.io/${{ github.repository }}:${{ steps.info.outputs.tag }} \
            ghcr.io/${{ github.repository }}:${{ steps.info.outputs.tag }}-amd64 \
            ghcr.io/${{ github.repository }}:${{ steps.info.outputs.tag }}-arm64 \
            ghcr.io/${{ github.repository }}:${{ steps.info.outputs.tag }}-armv7
          docker manifest push ghcr.io/${{ github.repository }}:${{ steps.info.outputs.tag }}
          echo "✓ Pushed: ghcr.io/${{ github.repository }}:${{ steps.info.outputs.tag }}"

  notify:
    if: always()
    needs: [manual-build, create-manifest]
    runs-on: ubuntu-latest

    steps:
      - name: "Build Status"
        run: |
          if [ "${{ needs.manual-build.result }}" = "success" ] && [ "${{ needs.create-manifest.result }}" = "success" ]; then
            echo "✅ Manual build completed successfully!"
            echo "📦 Images published to GitHub Container Registry"
          else
            echo "❌ Build failed or was cancelled"
            exit 1
          fi
