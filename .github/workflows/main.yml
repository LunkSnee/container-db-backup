name: "Build and Publish Docker Image"

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "Dockerfile"
      - "install/**"
      - "**.md"
      - ".github/workflows/main.yml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "Dockerfile"
      - "install/**"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image to registry"
        required: false
        default: "false"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            tag_suffix: amd64
          - platform: linux/arm64
            tag_suffix: arm64
          - platform: linux/arm/v7
            tag_suffix: armv7

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set lowercase image name"
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@v3

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Log in to GitHub Container Registry"
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Extract version from CHANGELOG"
        id: version
        run: |
          VERSION=$(grep -m 1 "^## " CHANGELOG.md | sed 's/^## \([^ ]*\).*/\1/')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version detected: ${VERSION}"

      - name: "Build and push Docker image"
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.event.inputs.push_image == 'true') }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-${{ matrix.tag_suffix }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-${{ matrix.tag_suffix }}
            ${{ github.ref == 'refs/heads/dev' && format('{0}/{1}:dev-{2}', env.REGISTRY, env.IMAGE_NAME, matrix.tag_suffix) || '' }}
          labels: |
            org.opencontainers.image.title=container-db-backup
            org.opencontainers.image.description=Production-grade database backup container with security hardening
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            org.opencontainers.image.revision=${{ github.sha }}

  create-manifest:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: "Log in to GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set lowercase image name"
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: "Extract version from CHANGELOG"
        id: version
        run: |
          # Clone to get CHANGELOG
          git clone https://github.com/${{ github.repository }}.git repo
          cd repo
          VERSION=$(grep -m 1 "^## " CHANGELOG.md | sed 's/^## \([^ ]*\).*/\1/')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: "Create and push multi-arch manifest"
        run: |
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-arm64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-armv7
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}

          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-arm64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-armv7
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: "Create and push dev manifest"
        if: github.ref == 'refs/heads/dev'
        run: |
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-arm64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-armv7
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev

  test:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Run Dockerfile linting"
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3028,DL3029

      - name: "Validate shell scripts"
        run: |
          find install -name "*.sh" -type f -exec sh -n {} \;
          echo "✓ All shell scripts are valid"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Extract version from CHANGELOG"
        id: version
        run: |
          VERSION=$(grep -m 1 "^## " CHANGELOG.md | sed 's/^## \([^ ]*\).*/\1/')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: "Check if release exists"
        id: check_release
        run: |
          RELEASE=$(gh release view v${{ steps.version.outputs.version }} 2>/dev/null || echo "")
          if [ -z "$RELEASE" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
          else
            echo "exists=true" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Create GitHub Release"
        if: steps.check_release.outputs.exists == 'false'
        run: |
          RELEASE_NOTES=$(sed -n '/^## ${{ steps.version.outputs.version }}/,/^## /p' CHANGELOG.md | head -n -1)
          gh release create v${{ steps.version.outputs.version }} \
            --title "Release ${{ steps.version.outputs.version }}" \
            --notes "Container image published to: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`

          ${RELEASE_NOTES}" \
            --target main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
